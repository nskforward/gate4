syntax = "proto3";

package proto;

option go_package = "gate4/pkg/pb";

service Trading {
  rpc SubscribeQuotes(SymbolRequest) returns (stream Quote);
}

message SymbolRequest {
  string account_id = 1;
  string symbol = 2;
}

message Quote {
  string symbol = 1;
  int64 timestamp = 2;
  string ask = 3;
  string bid = 4;
}
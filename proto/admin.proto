syntax = "proto3";

package proto;

option go_package = "gate4/pkg/pb";

message Account {
  string broker_id = 1;
  string id = 2;
  string secret = 3;
  int64 valid_until = 4;
}

message EmptyMessage {}

// brokers

message ListAccountsResponse {
  repeated Account items = 1;
}

message AddAccountRequest {
  Account account = 1;
}

message DeleteAccountRequest {
  string key = 1;
}
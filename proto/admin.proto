syntax = "proto3";

package proto;

option go_package = "gate4/pkg/pb";

import "gateway.proto";

message Account {
  string broker_id = 1;
  string id = 2;
  string secret = 3;
  int64 valid_until = 4;
}

message EmptyMessage {}

// brokers

message ListAccountsResponse {
  repeated Account items = 1;
}

message AddAccountRequest {
  Account account = 1;
}

message GetPositionsResponse {
  repeated Position positions = 1;
}

message GetScheduleRequest {
  string account_key = 1;
  string symbol = 2;
}

message GetScheduleResponse {
  ScheduleSession current_session = 1;
  repeated ScheduleSession sessions = 2;
}

message ScheduleSession {
  string type = 1;
  int64 start = 2;
  int64 end = 3;
}
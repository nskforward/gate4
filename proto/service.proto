syntax = "proto3";

package proto;

option go_package = "gate4/pkg/pb";

import "account.proto";
import "admin.proto";

service Gateway {
  rpc GetAccount(AccountRequest) returns (AccountResponse) {}
}

service Admin {
  rpc ListAccounts(EmptyMessage) returns (ListAccountsResponse) {}
  rpc AddAccount(AddAccountRequest) returns (EmptyMessage) {}
  rpc DeleteAccount(DeleteAccountRequest) returns (EmptyMessage) {}
}
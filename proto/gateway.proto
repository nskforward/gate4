syntax = "proto3";

package proto;

option go_package = "gate4/pkg/pb";

message AccountRequest {
  string account_key = 1;
}

message AccountResponse {
  string broker_id = 1;
  string account_id = 2;
}

message QuoteStreamRequest {
  string account_key = 1;
  string symbol = 2;
}

message QuoteStreamResponse {
  string broker_id = 1;
  string symbol = 2;
  int64 timestamp = 3;
  string ask = 4;
  string bid = 5;
}